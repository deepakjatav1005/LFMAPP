      }
      /* Theme Definitions */

        --color-primary-300: 94 234 212;

      }
      .theme-indigo {
        --color-primary-50: 238 242 255;
        --color-primary-100: 224 231 255;
        --color-primary-200: 199 210 254;
        --color-primary-300: 165 180 252;
        --color-primary-400: 129 140 248;

        --color-primary-700: 67 56 202;
        --color-primary-800: 55 48 163;

      .theme-emerald {
        --color-primary-50: 236 253 245;
        --color-primary-100: 209 250 229;

        --color-primary-300: 110 231 183;

        --color-primary-800: 6 95 70;
        --color-primary-900: 6 78 59;
        --color-primary-950: 2 44 34;
      }
      /* Custom print styles for printing cards, receipts & reports */
      @media print {
        @page {
          size: A4 portrait;
          margin: 10mm;
        }

        *, *:before, *:after {
          box-shadow: none !important;
          text-shadow: none !important;
        }

        html, body, #root, main, div#root > div {
          background: #ffffff !important;
          color: #000000 !important;
          margin: 0 !important;
          padding: 0 !important;
          height: auto !important;
          min-height: auto !important;
          max-height: none !important;
          overflow: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Hide layout chrome, sidebar, header, footers, navigation, buttons, controls */
        header, footer, nav, aside, button, input, select, textarea, .print\:hidden {
          display: none !important;
          visibility: hidden !important;
        }

        /* Override dark modal overlays during print so they don't produce a dark background */
        div[class*="fixed"], div[class*="absolute"], div[class*="backdrop"], div[class*="bg-slate-900"], div[class*="bg-black"], div[class*="overflow-y-auto"] {
          position: static !important;
          overflow: visible !important;
          height: auto !important;
          max-height: none !important;
          width: 100% !important;
          max-width: none !important;
          background: #ffffff !important;
          background-color: #ffffff !important;
          box-shadow: none !important;
          backdrop-filter: none !important;
          padding: 0 !important;
          margin: 0 !important;
          border: none !important;
        }

        /* Printable containers rendering rules */
        #printable-area, #receipt-print-area, .printable-area {
          display: block !important;
          visibility: visible !important;
          position: relative !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 auto !important;
          padding: 10px !important;
          border: 1px solid #000000 !important;
          background: #ffffff !important;
          color: #000000 !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        /* Force table text and borders to print sharply */
        table {
          width: 100% !important;
          border-collapse: collapse !important;
          font-size: 11px !important;
        }

        th, td {
          border: 1px solid #000000 !important;
          padding: 5px 8px !important;
          color: #000000 !important;
        }

        thead {
          background-color: #f1f5f9 !important;
          display: table-header-group !important;
        }

        tr {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        .page-break-inside-avoid {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        .page-break-after-always {
          page-break-after: always !important;
          break-after: always !important;
        }
      }
    </style>
    <script>
      const withOpacity = (variableName) => ({ opacityValue }) => {
        if (opacityValue !== undefined) {
          return `rgba(var(${variableName}), ${opacityValue})`;
        }
        return `rgb(var(${variableName}))`;
      }

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#0d9488',
                '50': '#f0fdfa',
                '100': '#ccfbf1',
                '200': '#99f6e4',
                '300': '#5eead4',
                '400': '#2dd4bf',
                '500': '#14b8a6',
                '600': '#0d9488',
                '700': '#0f766e',
                '800': '#115e59',
                '900': '#134e4a',
                '950': '#042f2e',
              },
            },
            fontFamily: {
              sans: ['"Noto Sans Devanagari"', 'Inter', '"Segoe UI"', 'Mangal', '"Nirmala UI"', 'system-ui', 'sans-serif'],
              devanagari: ['"Noto Sans Devanagari"', '"Tiro Devanagari Hindi"', 'Mangal', '"Nirmala UI"', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'slide-up': 'slideUp 0.5s ease-in-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              },
              slideUp: {
                '0%': { opacity: 0, transform: 'translateY(20px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              }
            },
          },
        },
      }
    </script>
