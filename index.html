    <style>
      /* Subtle crisp soft-blue background pattern */
      body {
        background-color: #f0f6ff; /* Soft ice-blue background */
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2393c5fd' fill-opacity='0.18'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        color: #020617;
      }

      /* Global Dark Bold High-Contrast Text Legibility */
      body, input, select, textarea, button {
        font-family: 'Noto Sans Devanagari', 'Yantramanav', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      h1, h2, h3, h4, h5, h6 {
        color: #020617 !important;
        font-weight: 800 !important;
      }
      th {
        color: #020617 !important;
        font-weight: 800 !important;
      }
      label {
        color: #0f172a !important;
        font-weight: 700 !important;
      }
      input, select, textarea {
        color: #020617 !important;
        font-weight: 600 !important;
      }

      /* Darkening and strengthening muted / faded text across all pages */
      .text-slate-400, .text-gray-400, .text-zinc-400, .text-neutral-400 {
        color: #475569 !important;
        font-weight: 600 !important;
      }
      .text-slate-500, .text-gray-500, .text-zinc-500, .text-neutral-500 {
        color: #334155 !important;
        font-weight: 600 !important;
      }
      .text-slate-600, .text-gray-600, .text-zinc-600, .text-neutral-600 {
        color: #1e293b !important;
        font-weight: 600 !important;
      }
      .text-slate-700, .text-gray-700, .text-zinc-700, .text-neutral-700 {
        color: #0f172a !important;
        font-weight: 700 !important;
      }
      .text-slate-800, .text-gray-800, .text-zinc-800, .text-neutral-800 {
        color: #020617 !important;
        font-weight: 800 !important;
      }
      .text-slate-900, .text-gray-900, .text-zinc-900, .text-neutral-900 {
        color: #000000 !important;
        font-weight: 900 !important;
      }

      /* Pure White & Blue Clean Dynamic Theme Definitions */
      .theme-blue, :root {
        --color-primary-50: 239 246 255;
        --color-primary-100: 219 234 254;
        --color-primary-200: 191 219 254;
        --color-primary-300: 147 197 253;
        --color-primary-400: 96 165 250;
        --color-primary-500: 37 99 235;
        --color-primary-600: 29 78 216;
        --color-primary-700: 30 64 175;
        --color-primary-800: 30 58 138;
        --color-primary-900: 23 37 84;
        --color-primary-950: 15 23 42;
      }
      .theme-navy {
        --color-primary-50: 240 249 255;
        --color-primary-100: 224 242 254;
        --color-primary-200: 186 230 253;
        --color-primary-300: 125 211 252;
        --color-primary-400: 56 189 248;
        --color-primary-500: 14 165 233;
        --color-primary-600: 2 132 199;
        --color-primary-700: 3 105 161;
        --color-primary-800: 7 89 133;
        --color-primary-900: 12 74 110;
        --color-primary-950: 8 47 73;
      }
      .theme-cobalt {
        --color-primary-50: 238 242 255;
        --color-primary-100: 224 231 255;
        --color-primary-200: 199 210 254;
        --color-primary-300: 165 180 252;
        --color-primary-400: 129 140 248;
        --color-primary-500: 99 102 241;
        --color-primary-600: 79 70 229;
        --color-primary-700: 67 56 202;
        --color-primary-800: 55 48 163;
        --color-primary-900: 49 46 129;
        --color-primary-950: 30 27 75;
      }
      .theme-sky {
        --color-primary-50: 240 253 250;
        --color-primary-100: 204 251 241;
        --color-primary-200: 153 246 228;
        --color-primary-300: 94 234 212;
        --color-primary-400: 45 212 191;
        --color-primary-500: 20 184 166;
        --color-primary-600: 13 148 136;
        --color-primary-700: 15 118 110;
        --color-primary-800: 17 94 89;
        --color-primary-900: 19 78 74;
        --color-primary-950: 4 47 46;
      }

      /* Explicit Primary Theme Utility Classes */
      .bg-primary {
        background-color: rgb(var(--color-primary-600)) !important;
      }
      .bg-primary-50 {
        background-color: rgb(var(--color-primary-50)) !important;
      }
      .bg-primary-100 {
        background-color: rgb(var(--color-primary-100)) !important;
      }
      .bg-primary-200 {
        background-color: rgb(var(--color-primary-200)) !important;
      }
      .bg-primary-600 {
        background-color: rgb(var(--color-primary-600)) !important;
      }
      .bg-primary-700 {
        background-color: rgb(var(--color-primary-700)) !important;
      }
      .bg-primary-800 {
        background-color: rgb(var(--color-primary-800)) !important;
      }
      .text-primary {
        color: rgb(var(--color-primary-600)) !important;
      }
      .text-primary-700 {
        color: rgb(var(--color-primary-700)) !important;
      }
      .text-primary-800 {
        color: rgb(var(--color-primary-800)) !important;
      }
      .text-primary-900 {
        color: rgb(var(--color-primary-900)) !important;
      }
      .border-primary {
        border-color: rgb(var(--color-primary-500)) !important;
      }
      .border-primary-200 {
        border-color: rgb(var(--color-primary-200)) !important;
      }
      .border-primary-300 {
        border-color: rgb(var(--color-primary-300)) !important;
      }
      .border-primary-500 {
        border-color: rgb(var(--color-primary-500)) !important;
      }
      .border-primary-600 {
        border-color: rgb(var(--color-primary-600)) !important;
      }
      .ring-primary:focus, .focus\:ring-primary:focus {
        --tw-ring-color: rgb(var(--color-primary-500)) !important;
      }
      /* Custom print styles for printing cards, receipts & reports */
      @media print {
        @page {
          size: auto;
          margin: 4mm 6mm;
        }
        @page landscape {
          size: A4 landscape;
          margin: 2mm 3mm;
        }

        *, *:before, *:after {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
          box-sizing: border-box !important;
        }

        html, body, #root, main {
          background: #ffffff !important;
          color: #000000 !important;
          margin: 0 !important;
          padding: 0 !important;
          height: auto !important;
          min-height: auto !important;
          max-height: none !important;
          overflow: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Hide layout chrome, sidebar, header, footers, navigation, buttons, controls */
        header, footer, nav, aside, button, input:not([type="checkbox"]), select, textarea, .print\:hidden, .no-print, [class*="no-print"] {
          display: none !important;
          visibility: hidden !important;
        }

        /* Modal backdrop reset without interfering with certificate internals */
        body > div > div.fixed, body > div > div.backdrop-blur-md, div[class*="backdrop-blur"] {
          position: static !important;
          background: transparent !important;
          background-color: transparent !important;
          padding: 0 !important;
          margin: 0 !important;
          box-shadow: none !important;
          border: none !important;
          width: 100% !important;
          max-width: none !important;
          height: auto !important;
          max-height: none !important;
          overflow: visible !important;
        }

        /* Printable containers rendering rules */
        #printable-area, #receipt-print-area, .printable-area, #printable-business-certificate, .printable-certificate {
          display: block !important;
          visibility: visible !important;
          position: relative !important;
          width: 100% !important;
          margin: 0 auto !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        .printable-landscape, .certificate-landscape, #printable-business-certificate, [data-orientation="landscape"] {
          page: landscape !important;
          max-width: 292mm !important;
          width: 100% !important;
        }

        #printable-business-certificate {
          max-width: 290mm !important;
          width: 100% !important;
          height: auto !important;
          margin: 0 auto !important;
          padding: 1.5mm 2.5mm !important;
          box-sizing: border-box !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          page-break-after: avoid !important;
          break-after: avoid !important;
          page-break-before: avoid !important;
          break-before: avoid !important;
          overflow: visible !important;
        }

        #printable-business-certificate * {
          overflow: visible !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Force table text and borders only for data report tables, not styled certificates */
        .printable-report table, .report-table table, table.data-table {
          width: 100% !important;
          border-collapse: collapse !important;
          font-size: 11px !important;
        }

        .printable-report th, .printable-report td, .report-table th, .report-table td, table.data-table th, table.data-table td {
          border: 1px solid #000000 !important;
          padding: 5px 8px !important;
          color: #000000 !important;
        }

        thead {
          background-color: #f1f5f9 !important;
          display: table-header-group !important;
        }

        tr {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        .page-break-inside-avoid {
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        .page-break-after-always {
          page-break-after: always !important;
          break-after: always !important;
        }
      }
    </style>
    <script>
      const withOpacity = (variableName) => ({ opacityValue }) => {
        if (opacityValue !== undefined) {
          return `rgba(var(${variableName}), ${opacityValue})`;
        }
        return `rgb(var(${variableName}))`;
      }

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: withOpacity('--color-primary-600'),
                '50': withOpacity('--color-primary-50'),
                '100': withOpacity('--color-primary-100'),
                '200': withOpacity('--color-primary-200'),
                '300': withOpacity('--color-primary-300'),
                '400': withOpacity('--color-primary-400'),
                '500': withOpacity('--color-primary-500'),
                '600': withOpacity('--color-primary-600'),
                '700': withOpacity('--color-primary-700'),
                '800': withOpacity('--color-primary-800'),
                '900': withOpacity('--color-primary-900'),
                '950': withOpacity('--color-primary-950'),
              },
            },
            fontFamily: {
              sans: ['"Noto Sans Devanagari"', 'Inter', '"Segoe UI"', 'Mangal', '"Nirmala UI"', 'system-ui', 'sans-serif'],
              devanagari: ['"Noto Sans Devanagari"', '"Tiro Devanagari Hindi"', 'Mangal', '"Nirmala UI"', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'slide-up': 'slideUp 0.5s ease-in-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              },
              slideUp: {
                '0%': { opacity: 0, transform: 'translateY(20px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              }
            },
          },
        },
      }
    </script>
